<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터로 찾는 산업·건물 에너지절감 실무 - p.113</title><link rel="stylesheet" href="../css/page.css"></head><body><main class="book-page"><main xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><h1>CHAPTER 25 REVIEW</h1><p>CHAPTER 25 REVIEW MES 와 EMS 의 날짜·시간·설비·LOT 연결기준을 정의한다. 캘린더 날짜와 실제 생산일을 구분한다. 원시데이터와 분석용 집계데이터를 분리하여 보존한다. 파생변수의 계산식과 전처리 규칙을 기록한다. 데이터 사전과 데이터·전처리 버전을 관리하여 분석과 M&amp;V 의 재현성을 확보 한다.</p><div class="page-marker">인쇄본 기준 p. 113</div></main></main></body></html>
