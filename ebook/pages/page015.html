<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터로 찾는 산업·건물 에너지절감 실무 - p.15</title><link rel="stylesheet" href="../css/page.css"></head><body><main class="book-page"><main xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><h1>PART 1 CORE FLOW</h1><p>PART 1 CORE FLOW 계측경계 정의 → 데이터 정합성 확인 → KPI 산정 → Baseline 구축 → M&amp;V 계획 설정 → 비효율 탐색 → 운전변수 도출 → 개선 실행 → 성과 검증(M&amp;V) 데이터 기반 에너지절감 컨설팅은 데이터를 많이 수집하는 활동이 아니라, 데 이터를 이용해 현재 운전을 설명하고 실행 가능한 개선점을 찾은 뒤 그 효과 를 재현 가능하게 검증하는 과정이다.</p><div class="page-marker">인쇄본 기준 p. 15</div></main></main></body></html>
