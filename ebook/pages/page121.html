<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터로 찾는 산업·건물 에너지절감 실무 - p.121</title><link rel="stylesheet" href="../css/page.css"></head><body><main class="book-page"><main xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><h1>CHAPTER 28 REVIEW</h1><p>CHAPTER 28 REVIEW M&amp;V 는 개선 후가 아니라 개선 전부터 설계한다. 계측경계와 Baseline 기간, 영향인자, 평가방법을 사전에 정한다. Routine / Non-routine Adjustment 와 제외일을 일관되게 관리한다. 절감량은 Adjusted Baseline − Actual 로 산정한다. 누적성과는 동일 모델·조정·제외기준에서만 합산한다. 예상치·목표치·검증실적과 데이터·모델 버전을 재현 가능하게 기록한다.</p><div class="page-marker">인쇄본 기준 p. 121</div></main></main></body></html>
