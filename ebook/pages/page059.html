<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터로 찾는 산업·건물 에너지절감 실무 - p.59</title><link rel="stylesheet" href="../css/page.css"></head><body><main class="book-page"><main xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><h1>CHAPTER 11 REVIEW</h1><p class="note">CHAPTER SYNTHESIS | 냉동기 최적화의 의사결정 KPI 는 개별 냉동기 COP 가 아니라 냉동기·펌프·냉각탑을 포함한 Plant 전체 효율이어야 한다. CHAPTER 11 REVIEW 개별 냉동기 COP 와 Plant 전체 kW/RT 를 구분한다. 계절별 부하·습구온도·제습조건을 반영해 가동대수와 냉수·냉각수 Set Point 를 운영표로 만든다. 최소부하·기동횟수·예비기·정비계획을 필수 운전제약으로 관리한다.</p><div class="page-marker">인쇄본 기준 p. 59</div></main></main></body></html>
